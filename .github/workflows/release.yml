name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Audit TypeScript types
        run: npm run audit:types

      - name: ESLint
        run: npm run lint

      - name: Vitest and coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  publish:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and load image for smoke verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: magicarena-release:verify
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.ref_name }}-${{ github.run_id }}
          cache-from: type=gha

      - name: Verify image size and /health GIT_SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SIZE_BYTES="$(docker image inspect magicarena-release:verify --format '{{.Size}}')"
          echo "Built image size: ${SIZE_BYTES} bytes"
          if [ "${SIZE_BYTES}" -ge 200000000 ]; then
            echo "Image size ${SIZE_BYTES} exceeds 200 MB limit" >&2
            exit 1
          fi

          CID="$(docker run -d --rm -p 127.0.0.1:3000:3000 -e ALLOWED_ORIGINS=http://127.0.0.1:3000 magicarena-release:verify)"
          cleanup() {
            docker stop "${CID}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat /tmp/health.json
          node -e "const fs=require('node:fs'); const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); if(h.status!=='ok'||h.gitSha!==process.env.EXPECTED_SHA){console.error('Unexpected /health payload:',h);process.exit(1);}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.ref_name }}-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy hook (if configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
            curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}" >/dev/null
            echo "Triggered Render deploy hook."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set; skipping automatic Render deploy trigger."
          fi

